<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inquiry | Teacher Roma</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Inquiry Form</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="coding.html">Coding Classes</a>
    <a href="baking.html">Baking Workshop</a>
    <a href="inquiry.html">Inquiry</a>
  </nav>
</header>

<section class="form-section">
  <h2>Send an Inquiry</h2>

  <form id="inquiryForm">
    <label>Full Name</label>
    <input type="text" id="name" required>

    <label>Email Address</label>
    <input type="email" id="email" required>

    <label>Service Interested In</label>
    <select id="service" required>
      <option value="">Choose one</option>
      <option value="Coding Class">Coding Class</option>
      <option value="Baking Workshop">Baking Workshop</option>
      <option value="Both">Both</option>
    </select>

    <label>Preferred Schedule</label>
    <input type="text" id="schedule" placeholder="Example: Tuesday morning">

    <label>Message</label>
    <textarea id="message" rows="5" required></textarea>

    <button type="submit" class="btn">Send to Email</button>
  </form>

  <a class="messenger-btn" href="https://m.me/YOUR_PAGE_USERNAME" target="_blank">
    Message Me on Facebook Messenger
  </a>
</section>

<footer>
  <p>© 2026 Teacher Roma</p>
</footer>

<script src="script.js"></script>
</body>
</html>
